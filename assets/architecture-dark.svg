<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="Architecture of the Tanzanite Auto Traders platform on AWS">
<style>
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
  .b { font-size: 14px; font-weight: 700; }
  .s { font-size: 11.5px; fill: #8b949e; }
  .g { font-size: 12px; font-weight: 700; fill: #1f6feb; }
  .w { fill: none; stroke: #30363d; stroke-width: 2; }
  .f { fill: none; stroke: #3fb950; stroke-width: 2; stroke-dasharray: 5 12; animation: f 1.4s linear infinite; }
  @keyframes f { to { stroke-dashoffset: -34; } }
</style>
<rect width="1000" height="430" rx="14" fill="#0d1117" stroke="#30363d"/>
<rect x="250" y="40" width="480" height="232" rx="12" fill="none" stroke="#1f6feb" stroke-dasharray="6 5"/>
<text x="266" y="62" class="g">AWS EC2 · Docker Compose · eu-west-2</text>
